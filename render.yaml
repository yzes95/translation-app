services:
  # 1. Frontend: High-performance Static Site (Always awake, free CDN)
  - type: web
    name: linguaflow
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate

  # 2. Backend: Node Express Web Service (Frankfurt region, free)
  - type: web
    name: linguaflow-api
    runtime: node
    region: frankfurt
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 5000
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_ORIGIN
        sync: false
